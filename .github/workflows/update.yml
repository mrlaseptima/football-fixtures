name: update-fixtures
on:
  schedule: [{ cron: "0 */3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-fixtures.mjs
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - run: |
          git config user.name "fixtures-bot"
          git config user.email "bot@users.noreply.github.com"
          git add fixtures.json
          git diff --cached --quiet || (git commit -m "chore: update fixtures" && git push)
